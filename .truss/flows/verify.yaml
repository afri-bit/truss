# The quality gate's checks, as a TRUSS pipeline: `truss run verify`.
# The same checks as scripts/verify.sh (which CI and the agent hooks keep using), run side by side.
# It needs bash, Go, python3 and jq, and golangci-lint v2.15.0 in the Go bin folder
# (go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0); the first lint
# step checks the version, as verify.sh does.
version: "1"

pipeline:
  name: verify
  concurrency: 4          # independent jobs side by side
  overlap: skip

jobs:
  format:
    steps:
      - id: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

  vet:
    steps:
      - id: go-vet
        run: go vet ./...

  lint:
    steps:
      - id: version
        run: |
          gobin="$(go env GOBIN)"; gopath="$(go env GOPATH)"; gopath="${gopath%%:*}"
          lint="${gobin:-$gopath/bin}/golangci-lint"
          "$lint" version 2>/dev/null | grep -q 'version 2.15.0 ' || { echo "need golangci-lint v2.15.0 at $lint"; exit 1; }
      - id: linux
        run: |
          gobin="$(go env GOBIN)"; gopath="$(go env GOPATH)"; gopath="${gopath%%:*}"
          "${gobin:-$gopath/bin}/golangci-lint" run ./...
        timeout: 10m
      - id: windows-files
        run: |
          gobin="$(go env GOBIN)"; gopath="$(go env GOPATH)"; gopath="${gopath%%:*}"
          GOOS=windows "${gobin:-$gopath/bin}/golangci-lint" run ./...
        timeout: 10m
      - id: macos-files
        run: |
          gobin="$(go env GOBIN)"; gopath="$(go env GOPATH)"; gopath="${gopath%%:*}"
          GOOS=darwin "${gobin:-$gopath/bin}/golangci-lint" run ./...
        timeout: 10m

  test:
    steps:
      - id: go-test
        run: go test -race -count=1 ./...
        timeout: 15m

  tooling:
    steps:
      - id: memory
        run: python3 scripts/memory.py validate
      - id: python
        run: python3 -m unittest discover -s scripts/tests
      - id: shell
        run: |
          bash .claude/hooks/guard-git_test.sh &&
          bash .github/scripts/branch-name-check_test.sh &&
          bash .github/scripts/commit-identity-check_test.sh &&
          bash .github/scripts/release-check_test.sh &&
          bash scripts/verify_test.sh

  e2e:
    needs: [test]         # a built binary is only worth running once the tests pass
    steps:
      - id: build
        run: go build -o "$TRUSS_DATA_DIR/truss" ./cmd/truss
        env:
          CGO_ENABLED: "0"
      - id: run
        run: bash .github/scripts/e2e-test.sh "$TRUSS_DATA_DIR/truss"
        timeout: 10m
