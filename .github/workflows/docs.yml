name: Docs site

# Builds the documentation site (site/, Astro and Starlight) when the site or the docs it is
# made from change. A link in docs/ to a file that does not exist fails the build. Publishing is
# not done here (it needs repository settings): see site/README.md. ADR 0016.
on:
  push:
    branches: [main, develop]
    paths:
      - site/**
      - docs/**
      - internal/webui/assets/fonts/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - site/**
      - docs/**
      - internal/webui/assets/fonts/**
      - .github/workflows/docs.yml

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the site (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # --ignore-scripts: nothing in the tree needs an install script on Linux, and a later
      # lockfile change must not be able to run code on the runner.
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test the docs sync
        run: npm test

      - name: Build
        run: npm run build
        env:
          SYNC_STRICT: "1"
