name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag, go.mod, and CHANGELOG.md agree
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Re-fetch so an annotated tag keeps its tagger date.
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          tag_date="$(git for-each-ref --format='%(creatordate:short)' "refs/tags/${TAG}")"
          echo "tag ${TAG} created ${tag_date}"
          bash .github/scripts/release-check.sh "$TAG" "$tag_date" release-notes.md

          echo "version=${TAG#v}" >>"$GITHUB_OUTPUT"
          case "$TAG" in
            *-*) echo "prerelease=true" >>"$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >>"$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  ci:
    name: CI
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [validate, ci]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build and archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          name="truss_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "stage/${name}" dist
          go build -trimpath -ldflags="-s -w" -o "stage/${name}/truss$(go env GOEXE)" ./cmd/truss
          cp LICENSE NOTICE README.md CHANGELOG.md "stage/${name}/"
          if [ "$GOOS" = "windows" ]; then
            (cd stage && zip -qr "../dist/${name}.zip" "${name}")
          else
            tar -C stage -czf "dist/${name}.tar.gz" "${name}"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Checksums
        run: |
          cd dist
          sha256sum -- * >checksums.txt
          cat checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          # --notes-file content is prepended to the notes generated by the
          # GitHub release notes API (--generate-notes).
          flags=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file release-notes.md --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease --latest=false)
          else
            flags+=(--latest)
          fi
          gh release create "$TAG" dist/* "${flags[@]}"
