name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.14.0

jobs:
  check:
    name: lint + test (${{ matrix.os }})
    # Full OS matrix for pull requests into main; Ubuntu only otherwise.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'pull_request' && github.base_ref == 'main') && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Check spec templates are in sync
        if: runner.os == 'Linux'
        run: make spec-check

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Test (race)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Build
        run: go build -o bin/ ./cmd/truss

      - name: Build with version metadata
        if: runner.os == 'Linux'
        run: make build && ./bin/truss

      - name: Cross-compile (CGO disabled)
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "::group::$target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/truss
            echo "::endgroup::"
          done

  integration:
    name: integration (ubuntu, Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Docker info
        run: docker info

      - name: Integration tests
        run: make test-integration
