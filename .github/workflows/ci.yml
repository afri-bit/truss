name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      # Baseline: golangci-lint has never run in CI. It is non-blocking until
      # the baseline findings (two known on develop: cmd/truss/run.go G301 at
      # line 88 and G304 at line 93) are fixed or recorded; then drop continue-on-error.
      # Built with go install so it uses the runner's Go (the repo's Go version
      # is newer than prebuilt release binaries). Ubuntu only to keep the matrix cheap.
      - name: golangci-lint
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" run ./...

      # A separate step so Windows-only files are linted even when the Linux run reports findings.
      - name: golangci-lint (Windows files)
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: GOOS=windows "$(go env GOPATH)/bin/golangci-lint" run ./...

      # -race needs cgo. Windows runners may lack gcc; then run without -race.
      - name: Choose race flag
        id: race
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ] && ! command -v gcc >/dev/null 2>&1; then
            echo "::notice::gcc not found on this Windows runner; running tests without -race"
            echo "flag=" >> "$GITHUB_OUTPUT"
          else
            echo "flag=-race" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit and integration tests
        shell: bash
        run: go test ${{ steps.race.outputs.flag }} -count=1 ./...

      - name: Concurrency stress
        shell: bash
        run: go test ${{ steps.race.outputs.flag }} -count=20 -run 'Concurren|Stop|Tree' ./internal/engine ./internal/executor ./internal/runlog ./cmd/truss

      # CGO_ENABLED=0 as in release.yml: the test steps above link with cgo
      # (-race needs it), so this is the only run of a release-style binary.
      # On macOS it proves that every libSystem function internal/metrics
      # imports resolves at start-up (ADR 0013).
      - name: Build and end-to-end script
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          bin="bin/truss$(go env GOEXE)"
          go build -o "$bin" ./cmd/truss
          bash .github/scripts/e2e-test.sh "$bin"

  # Browser tests for TRUSS Desktop (specs/013-desktop-polish). Linux only: the
  # suite is portable Node, but Chromium on three runners costs more than it
  # finds while the page is plain DOM code. Playwright is pinned in
  # tests/ui/package-lock.json and is not a dependency of the product.
  desktop-ui:
    name: Desktop UI (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json

      - name: Build truss
        run: go build -o bin/truss ./cmd/truss

      - name: Install Playwright and Chromium
        working-directory: tests/ui
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the browser tests
        working-directory: tests/ui
        run: npm test

  agent-tooling:
    name: Agent tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Memory, state and gate tests
        run: python3 -m unittest discover -s scripts/tests

      - name: Validate agent memory, state and log
        run: python3 scripts/memory.py validate

      - name: Hooks parse
        run: for f in .claude/hooks/*.sh; do bash -n "$f"; done
