name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Unit and integration tests
        shell: bash
        run: go test -count=1 ./...

  agent-tooling:
    name: Agent tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Memory, state and gate tests
        run: python3 -m unittest discover -s scripts/tests

      - name: Validate agent memory, state and log
        run: python3 scripts/memory.py validate

      - name: Hooks parse
        run: for f in .claude/hooks/*.sh; do bash -n "$f"; done
