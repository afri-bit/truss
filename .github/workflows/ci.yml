name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      # Baseline: golangci-lint has never run in CI. It is non-blocking until
      # the baseline findings are fixed or recorded; then drop continue-on-error.
      # Built with go install so it uses the runner's Go (the repo's Go version
      # is newer than prebuilt release binaries). Ubuntu only to keep the matrix cheap.
      - name: golangci-lint
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" run ./...

      # -race needs cgo. Windows runners may lack gcc; then run without -race.
      - name: Choose race flag
        id: race
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ] && ! command -v gcc >/dev/null 2>&1; then
            echo "NOTICE: gcc not found on this Windows runner; running tests without -race"
            echo "flag=" >> "$GITHUB_OUTPUT"
          else
            echo "flag=-race" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit and integration tests
        shell: bash
        run: go test ${{ steps.race.outputs.flag }} -count=1 ./...

      - name: Concurrency stress
        shell: bash
        run: go test ${{ steps.race.outputs.flag }} -count=20 -run 'Concurren|Stop|Tree' ./internal/engine ./internal/executor ./cmd/truss

      - name: Build and end-to-end script
        shell: bash
        run: |
          go build -o bin/truss ./cmd/truss
          if [ -f bin/truss.exe ]; then bin=bin/truss.exe; else bin=bin/truss; fi
          bash .github/scripts/e2e-test.sh "$bin"

  agent-tooling:
    name: Agent tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Memory, state and gate tests
        run: python3 -m unittest discover -s scripts/tests

      - name: Validate agent memory, state and log
        run: python3 scripts/memory.py validate

      - name: Hooks parse
        run: for f in .claude/hooks/*.sh; do bash -n "$f"; done
